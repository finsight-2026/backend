openapi: 3.1.0
info:
  title: FINSIGHT API
  version: 0.1.0
paths:
  /api/v1/surveys/current:
    get:
      operationId: getCurrentSurvey
      summary: 현재 설문 버전과 문항 조회
      responses:
        '200':
          description: 30개 문항 및 문항별 선택지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Survey'
  /api/v1/policies:
    get:
      summary: 문서 버전 목록과 현재 동의 버전 조회
      description: 시행일은 한국시간 기준이다. 로컬 미리보기는 서버 설정에서 활성화한 경우에만 제공된다.
      responses:
        '200':
          description: 현재 동의 버전 및 현재·예정·이전 문서의 메타데이터
          content:
            application/json:
              schema:
                type: object
                required: [activeVersion, documents]
                properties:
                  activeVersion: {type: [string, 'null']}
                  documents:
                    type: array
                    items: {$ref: '#/components/schemas/PolicyDocument'}
  /api/v1/policies/{id}/{version}:
    get:
      summary: 문서 ID와 버전으로 본문 조회
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, enum: [terms, privacy-policy, privacy-consent, research]}}
        - {in: path, name: version, required: true, schema: {type: string, maxLength: 64}}
      responses:
        '200':
          description: 선택 버전 메타데이터와 한국어 본문
          content:
            application/json:
              schema:
                type: object
                required: [document, body]
                properties:
                  document: {$ref: '#/components/schemas/PolicyDocument'}
                  body: {type: string}
        '404': {description: 공개할 수 있는 문서가 없음}
  /api/v1/auth/signup/code:
    post:
      summary: 로컬 가입 인증번호 요청
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email, maxLength: 254}
      responses:
        '200':
          description: 발송 성공과 인증·재발송 시각
          content:
            application/json:
              schema:
                type: object
                required: [expiresAt, resendAt]
                properties:
                  expiresAt: {type: string, format: date-time}
                  resendAt: {type: string, format: date-time}
        '400': {description: 잘못된 이메일}
        '429': {description: 재발송 대기 또는 발송 한도 초과}
  /api/v1/auth/signup/verify:
    post:
      summary: 로컬 인증 확인 및 계정 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, password, profile, terms, privacy, documentVersion]
              properties:
                email: {type: string, format: email, maxLength: 254}
                code: {type: string, pattern: '^[0-9]{6}$'}
                password: {type: string, format: password, minLength: 8, maxLength: 64}
                profile:
                  type: object
                  required: [age, situation, gender, housing, income, debt, expenses]
                  additionalProperties: {type: string}
                terms: {const: true}
                privacy: {const: true}
                research: {type: boolean, default: false}
                documentVersion: {type: string, maxLength: 64, description: 현재 문서 목록에서 확인한 activeVersion}
      responses:
        '201': {description: 계정과 동의 이력 저장 완료}
        '400': {description: 가입 입력 오류}
        '409': {description: 이미 등록된 주소}
        '410': {description: 번호 만료 또는 폐기}
        '412': {description: 동의 버전 변경 또는 현재 문서 미등록. 인증번호는 소비하지 않음}
        '422': {description: 번호 불일치}
  /api/v1/account/settings/consents/research:
    put:
      summary: 연구 활용 동의 또는 철회
      description: 신규 동의에는 현재 문서 버전이 필요하다. 철회는 마지막 유효 동의 버전에 기록하며 현재 문서가 없어도 요청할 수 있다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [granted]
              properties:
                granted: {type: boolean}
                version: {type: [string, 'null'], maxLength: 64}
      responses:
        '204': {description: 동의 또는 철회 처리 완료}
        '400': {description: 필수 입력 누락}
        '401': {description: 인증 실패}
        '412': {description: 신규 동의가 현재 버전과 다르거나 현재 문서가 없음}
  /api/v1/auth/password-reset/request:
    post:
      summary: 로컬 비밀번호 재설정 링크 요청
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email, maxLength: 254}
      responses:
        '202': {description: 계정 존재 여부와 관계없이 같은 접수 응답}
        '400': {description: 잘못된 이메일}
        '429': {description: 이메일 재요청 간격 또는 이메일·IP 시간당 요청 한도 초과}
  /api/v1/auth/password-reset/complete:
    post:
      summary: 일회용 링크 확인과 비밀번호 변경 및 전체 세션 폐기
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
                password: {type: string, format: password, minLength: 8, maxLength: 64}
      responses:
        '204': {description: 비밀번호 변경 및 세션 폐기 완료}
        '400': {description: 토큰 형식 또는 비밀번호 규칙 위반}
        '410': {description: 만료되었거나 이미 사용되었거나 교체된 링크}
  /api/v1/auth/login:
    post:
      summary: 이메일 로그인
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password}
      responses:
        '200':
          $ref: '#/components/responses/AppTokens'
        '401': {description: 인증 실패}
        '429': {description: 요청 제한}
  /api/v1/auth/social/providers:
    get:
      summary: 서버 설정이 완료된 소셜 제공자 조회
      responses:
        '200':
          description: 현재 사용할 수 있는 제공자 배열
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/SocialProvider'}}
  /api/v1/auth/social/start:
    post:
      summary: 소셜 로그인 또는 명시적으로 확인한 탈퇴 취소 인증 시작
      requestBody: {$ref: '#/components/requestBodies/SocialStart'}
      responses:
        '200': {$ref: '#/components/responses/SocialStart'}
        '400': {description: 허용되지 않은 인증 목적 또는 탈퇴 취소 확인 누락}
        '429': {description: 인증 시작 요청 한도 초과}
        '503': {description: 제공자 설정 없음}
  /api/v1/account/social/start:
    post:
      summary: 현재 앱 세션에 묶인 소셜 계정 연결 또는 본인 확인 시작
      security: [{appBearer: []}]
      requestBody: {$ref: '#/components/requestBodies/SocialStart'}
      responses:
        '200': {$ref: '#/components/responses/SocialStart'}
        '401': {description: 앱 세션 필요}
        '429': {description: 인증 시작 요청 한도 초과}
        '503': {description: 제공자 설정 없음}
  /api/v1/auth/social/callback/kakao:
    get:
      summary: 카카오 인증 콜백
      parameters:
        - {name: state, in: query, required: true, schema: {$ref: '#/components/schemas/SocialSecret'}}
        - {name: code, in: query, schema: {type: string}}
        - {name: error, in: query, schema: {type: string}}
      responses:
        '303': {$ref: '#/components/responses/SocialCallback'}
        '404': {description: 상태 불일치 또는 인증 만료}
  /api/v1/auth/social/callback/apple:
    post:
      summary: Apple 인증 콜백
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [state]
              properties:
                state: {$ref: '#/components/schemas/SocialSecret'}
                code: {type: string}
                error: {type: string}
      responses:
        '303': {$ref: '#/components/responses/SocialCallback'}
        '404': {description: 상태 불일치 또는 인증 만료}
  /api/v1/auth/social/finish:
    post:
      summary: 앱 확인값으로 소셜 로그인 결과 한 번 조회
      requestBody: {$ref: '#/components/requestBodies/SocialFinish'}
      responses:
        '200': {$ref: '#/components/responses/SocialOutcome'}
        '404': {description: 인증 결과 미완료·만료·재사용 또는 앱 확인값 불일치}
  /api/v1/account/social/finish:
    post:
      summary: 인증을 시작한 동일 세션에서 소셜 재인증 또는 계정 연결
      security: [{appBearer: []}]
      requestBody: {$ref: '#/components/requestBodies/SocialFinish'}
      responses:
        '200': {$ref: '#/components/responses/SocialOutcome'}
        '401': {description: 앱 세션 필요}
        '404': {description: 인증 결과 미완료·만료·재사용 또는 앱 확인값·세션 불일치}
  /api/v1/auth/social/email:
    post:
      summary: 제공자가 검증된 이메일을 제공하지 않은 신규 가입의 이메일 확인
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [onboardingToken, email]
              properties:
                onboardingToken: {$ref: '#/components/schemas/SocialSecret'}
                email: {type: string, format: email, maxLength: 254}
      responses:
        '200':
          description: 인증 만료 시각과 재발송 가능 시각
          content:
            application/json:
              schema:
                type: object
                required: [expiresAt, resendAt]
                properties:
                  expiresAt: {type: string, format: date-time}
                  resendAt: {type: string, format: date-time}
        '404': {description: 가입 확인값 만료 또는 이메일 인증 불필요}
        '429': {description: 인증번호 요청 한도 초과}
  /api/v1/auth/social/register:
    post:
      summary: 소셜 계정의 프로필·필수 동의 저장과 앱 세션 발급
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [onboardingToken, email, profile, terms, privacy, research, documentVersion]
              properties:
                onboardingToken: {$ref: '#/components/schemas/SocialSecret'}
                email: {type: string, format: email, maxLength: 254}
                code: {type: string, pattern: '^[0-9]{6}$'}
                profile:
                  type: object
                  required: [age, situation, gender, housing, income, debt, expenses]
                  additionalProperties: {type: string}
                terms: {const: true}
                privacy: {const: true}
                research: {type: boolean}
                documentVersion: {type: string}
      responses:
        '200': {$ref: '#/components/responses/SocialOutcome'}
        '400': {description: 읽을 수 없는 가입 요청}
  /api/v1/account/social/link:
    post:
      summary: 같은 이메일의 기존 계정을 5분 이내 재인증한 세션으로 연결
      security: [{appBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [onboardingToken]
              properties:
                onboardingToken: {$ref: '#/components/schemas/SocialSecret'}
      responses:
        '200': {$ref: '#/components/responses/SocialOutcome'}
        '401': {description: 앱 세션 필요}
  /api/v1/account/social/{provider}:
    delete:
      summary: 현재 계정의 소셜 연결 해제
      description: 5분 이내 재인증이 필요하며 마지막 로그인 방법은 유지해야 한다.
      security: [{appBearer: []}]
      parameters:
        - {name: provider, in: path, required: true, schema: {$ref: '#/components/schemas/SocialProvider'}}
      responses:
        '200': {$ref: '#/components/responses/SocialOutcome'}
        '401': {description: 앱 세션 필요}
  /api/v1/auth/refresh:
    post:
      summary: 앱 세션 토큰 회전
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
      responses:
        '200':
          $ref: '#/components/responses/AppTokens'
        '401': {description: 토큰 만료 또는 폐기}
  /api/v1/auth/logout:
    post:
      summary: 앱 세션 폐기
      security: [{appBearer: []}]
      responses:
        '204': {description: 폐기 완료}
        '401': {description: 인증 필요}
  /api/v1/auth/logout/revoke:
    post:
      summary: 오프라인에서 저장한 전용 토큰으로 해당 기기의 앱 세션 폐기
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revocationToken]
              properties:
                revocationToken: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
      responses:
        '204': {description: 폐기 완료 또는 이미 폐기된 세션}
        '400': {description: 요청 형식 오류}
  /api/v1/account/data-deletion:
    get:
      summary: 로그인한 사용자의 미완료 삭제 요청 조회
      security: [{appBearer: []}]
      responses:
        '200':
          description: 접수 또는 점검 상태의 삭제 요청
          headers:
            X-Finsight-Content-Epoch: {$ref: '#/components/headers/ContentEventEpoch'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DataDeletionReceipt'}
        '401': {description: 앱 세션 인증 필요}
        '404': {description: 본인 계정의 미완료 삭제 요청 없음}
    post:
      summary: 재인증한 사용자의 진단과 서비스 데이터 삭제 접수
      security: [{appBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId: {type: string, format: uuid}
      responses:
        '200':
          description: 같은 요청의 기존 완료 영수증
          headers:
            X-Finsight-Content-Epoch: {$ref: '#/components/headers/ContentEventEpoch'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DataDeletionReceipt'}
        '202':
          description: 삭제 요청 접수 또는 같은 계정의 미완료 요청 반환. 기존 데이터는 즉시 접근이 차단된다.
          headers:
            X-Finsight-Content-Epoch: {$ref: '#/components/headers/ContentEventEpoch'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DataDeletionReceipt'}
        '401': {description: 앱 세션 인증 필요}
        '403': {description: 신규 삭제 요청은 최근 재인증 필요}
  /api/v1/account/data-deletion/{requestId}:
    get:
      summary: 로그인한 사용자의 기존 삭제 요청 상태 조회
      security: [{appBearer: []}]
      parameters:
        - in: path
          name: requestId
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: 삭제 요청 상태와 완료 시각
          headers:
            X-Finsight-Content-Epoch: {$ref: '#/components/headers/ContentEventEpoch'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DataDeletionReceipt'}
        '401': {description: 앱 세션 인증 필요}
        '404': {description: 본인 계정의 삭제 요청 없음}
  /api/v1/notifications:
    get:
      summary: 본인 알림함과 읽지 않은 알림 여부 조회
      parameters:
        - name: filter
          in: query
          schema: {type: string, enum: [ALL, DIAGNOSIS, GUIDE, ECONOMY], default: ALL}
        - name: before
          in: query
          schema: {type: string}
          description: 이전 응답의 nextCursor 값
      responses:
        '200':
          description: 최근 90일 이내의 알림을 최신순으로 최대 20건 반환
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor, unread]
                properties:
                  nextCursor: {type: [string, 'null']}
                  unread: {type: boolean}
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, kind, title, body, createdAt, read]
                      properties:
                        id: {type: string, format: uuid}
                        kind: {type: string, enum: [PERIODIC, INCOMPLETE, GUIDE, ECONOMY, EXPORT]}
                        title: {type: string}
                        body: {type: string}
                        createdAt: {type: string, format: date-time}
                        read: {type: boolean}
        '400': {description: 잘못된 필터 또는 커서}
        '401': {description: 인증 필요}
  /api/v1/notifications/preferences:
    get:
      summary: 본인 알림 선호 조회
      responses:
        '200': {description: 전체와 정기 진단·미완료 진단·가이드·경제 요약의 개별 선호}
        '401': {description: 인증 필요}
    put:
      summary: 하나의 알림 선호 저장
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [setting, enabled]
              properties:
                setting: {type: string, enum: [ENABLED, PERIODIC, INCOMPLETE, GUIDE, ECONOMY]}
                enabled: {type: boolean}
      responses:
        '200': {description: 저장된 전체 선호}
        '400': {description: 잘못된 선호 항목 또는 상태}
        '401': {description: 인증 필요}
  /api/v1/notifications/device:
    put:
      summary: 현재 활성 앱 세션의 알림 기기 등록 또는 토큰 갱신
      description: iOS 권한과 계정의 전체 알림 선호가 허용된 경우 호출한다. 같은 제공자 토큰은 최신 세션 하나에만 연결된다.
      security: [{appBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, token]
              properties:
                provider: {type: string, enum: [FCM, FCM_FID, LOCAL]}
                token: {type: string, minLength: 20, maxLength: 4096, pattern: '^[A-Za-z0-9_:.=-]{20,4096}$'}
      responses:
        '204': {description: 현재 세션에 등록 완료}
        '400': {description: 등록 형식 오류}
        '401': {description: 활성 앱 세션 필요}
        '409': {description: 전체 알림이 꺼짐}
    delete:
      summary: 현재 활성 앱 세션의 알림 기기 등록 해제
      security: [{appBearer: []}]
      responses:
        '204': {description: 등록 해제 완료 또는 등록 없음}
        '401': {description: 활성 앱 세션 필요}
  /api/v1/notifications/{id}/target:
    get:
      summary: 본인 알림의 이동 대상 확인
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: 이동 대상과 조회 가능 여부. 뉴스 편성 공개 여부는 뉴스 API가 다시 검증.
          content:
            application/json:
              schema:
                type: object
                required: [kind, available]
                properties:
                  kind: {type: string, enum: [PERIODIC, INCOMPLETE, GUIDE, ECONOMY, EXPORT]}
                  resource: {type: [string, 'null']}
                  attemptId: {type: [string, 'null'], format: uuid}
                  available: {type: boolean}
        '401': {description: 인증 필요}
        '404': {description: 해당 본인 알림이 없거나 보관 기간 만료}
  /api/v1/notifications/{id}/read:
    put:
      summary: 본인 알림을 읽음으로 표시
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204': {description: 읽음 처리 완료}
        '401': {description: 인증 필요}
        '404': {description: 본인이 열 수 있는 알림이 없거나 보관 기간 만료}
  /api/v1/news/{id}/events:
    post:
      summary: 뉴스 카드 노출 또는 상세 열람 기록
      security: [{appBearer: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: edition, required: true, schema: {type: string, format: date}}
      requestBody: {$ref: '#/components/requestBodies/ContentEvent'}
      responses:
        '204': {$ref: '#/components/responses/ContentEventResult'}
        '404': {description: 현재 조회할 수 있는 뉴스 버전이 없음}
  /api/v1/news/{id}/image:
    get:
      summary: 이용자의 뉴스 편성에 포함된 현재 공개 이미지
      security: [{appBearer: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: edition, required: true, schema: {type: string, format: date}}
        - {in: query, name: revision, required: true, schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: 메타데이터 제거 후 재인코딩된 이미지
          content:
            image/jpeg:
              schema: {type: string, format: binary}
            image/png:
              schema: {type: string, format: binary}
        '404': {description: 현재 이용할 수 있는 편성·버전·이미지 없음}
  /api/v1/insights:
    get:
      summary: 본인 최신 진단과 유형·산식이 맞는 공개 인사이트 목록
      security: [{appBearer: []}]
      parameters:
        - {in: query, name: topic, schema: {enum: [YFSI_MEAN, EXTERNAL_AREA_MEAN, RESOURCE_DOMAIN_MEAN, PERCEIVED_STRESS_MEAN]}}
        - {in: query, name: before, schema: {type: string, format: date-time}}
        - {in: query, name: beforeId, schema: {type: string, format: uuid}}
      responses:
        '200': {description: 진단 여부와 최신 게시순 최대 20개 카드 및 추가 페이지 여부}
        '422': {description: 커서 시각과 ID는 함께 필요}
  /api/v1/insights/{id}:
    get:
      summary: 공개 행동 인사이트와 승인된 비교 지표
      security: [{appBearer: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: 공개 카드·본문·승인 지표·집계 기간·본인 반응}
        '404': {description: 공개본이 없거나 비교 공개 조건을 충족하지 않음}
  /api/v1/insights/{id}/events:
    post:
      summary: 인사이트 카드 노출 또는 상세 열람 기록
      security: [{appBearer: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      requestBody: {$ref: '#/components/requestBodies/ContentEvent'}
      responses:
        '204': {$ref: '#/components/responses/ContentEventResult'}
        '404': {description: 현재 조회할 수 있는 인사이트 버전이 없음}
  /api/v1/insights/{id}/helpful:
    put:
      summary: 인사이트 도움 반응을 원하는 최종 상태로 저장
      security: [{appBearer: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, helpful]
              properties:
                revision: {type: integer, minimum: 1}
                helpful: {type: boolean}
      responses:
        '200': {description: 최신 상세와 서버 확정 반응 수}
        '404': {description: 공개본 없음}
        '409': {description: 공개 버전 변경}
  /api/v1/guides:
    get:
      summary: 본인 진단 유형의 현재 공개 가이드
      security: [{appBearer: []}]
      parameters:
        - {in: query, name: attemptId, schema: {type: string, format: uuid}}
      responses:
        '200': {description: 본인 진단과 공개 기간에 해당하는 가이드 목록}
        '404': {description: 해당 본인 완료 진단 없음}
  /api/v1/guides/{id}/events:
    post:
      summary: 맞춤 가이드 카드 노출 기록
      security: [{appBearer: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: query, name: attemptId, required: true, schema: {type: string, format: uuid}}
      requestBody: {$ref: '#/components/requestBodies/ContentEvent'}
      responses:
        '204': {$ref: '#/components/responses/ContentEventResult'}
        '404': {description: 진단 또는 가이드 버전을 찾을 수 없거나 노출 이벤트가 아님}
  /api/v1/guides/widget:
    get:
      summary: 최신 진단의 이번 달 첫 미완료 추천 행동 조회
      security: [{appBearer: []}]
      responses:
        '200':
          description: 현재 추천 행동과 표시 상태이며 조회로 열람이나 완료를 기록하지 않는다.
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state: {type: string, enum: [AVAILABLE, NO_DIAGNOSIS, UNAVAILABLE, COMPLETE]}
                  attemptId: {type: [string, 'null'], format: uuid}
                  id: {type: [string, 'null']}
                  revision: {type: [integer, 'null']}
                  title: {type: [string, 'null']}
        '401': {description: 인증 필요}
        '409': {description: 서비스 데이터 삭제 처리 중}
  /api/v1/guides/{id}/view:
    post:
      summary: 본인 진단의 공개 가이드 열람
      security: [{appBearer: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: query, name: attemptId, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: revision, schema: {type: integer, minimum: 1}, description: 위젯에 표시한 가이드 버전}
      responses:
        '200': {description: 공개 가이드와 월별 완료 상태}
        '404': {description: 본인 진단 또는 해당 공개 가이드 없음}
        '409': {description: 요청한 공개 버전이 바뀜}
  /api/v1/guides/{id}/completion:
    put:
      summary: 월별 가이드 실천 완료 상태 저장
      security: [{appBearer: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: query, name: attemptId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [completed]
              properties:
                completed: {type: boolean}
                contentRevision: {type: integer, minimum: 1}
      responses:
        '200': {description: 현재 가이드와 확정된 월별 완료 상태}
        '404': {description: 해당 진단에서 열 수 있는 공개 가이드 없음}
        '409': {description: 공개 버전이 바뀌어 다시 조회해야 함}
  /api/v1/diagnosis/attempts/{id}/views:
    post:
      summary: 본인 완료 진단 결과 또는 연결 가이드 렌더링 기록
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId]
              properties:
                eventId: {type: string, format: uuid}
                contentId: {type: string, minLength: 1, maxLength: 80}
                contentRevision: {type: integer, minimum: 1}
      responses:
        '204': {description: 기록 완료 또는 동일 이벤트 ID 재요청}
        '401': {description: 인증 필요}
        '404': {description: 해당 본인 완료 진단 또는 연결 가이드 없음}
  /api/v1/diagnosis/attempts/widget:
    get:
      summary: 본인의 홈 위젯 요약 조회
      description: 날짜는 한국시간 기준이다. 진단이 없는 경우 기록 개월 수는 0이고 날짜·점수·유형은 비어 있다. 다음 진단 예정일은 마지막 진단일에 30일을 더한다. 점수와 유형은 각각 명시적으로 요청한 경우에만 포함한다.
      security:
        - appBearer: []
      parameters:
        - {in: query, name: showScore, schema: {type: boolean, default: false}}
        - {in: query, name: showType, schema: {type: boolean, default: false}}
      responses:
        '200':
          description: 현재 사용자에 대한 위젯 요약이며 Cache-Control은 no-store다.
          content:
            application/json:
              schema:
                type: object
                required: [streakMonths]
                properties:
                  streakMonths: {type: integer, minimum: 0}
                  lastDiagnosisDate: {type: [string, 'null'], format: date}
                  nextDiagnosisDate: {type: [string, 'null'], format: date}
                  daysUntilNext: {type: [integer, 'null']}
                  score: {type: [integer, 'null'], minimum: 0, maximum: 100}
                  representativeType: {type: [string, 'null']}
                  maximumPressureScore: {type: [integer, 'null'], minimum: 0, maximum: 100, description: 점수와 유형을 모두 요청한 경우에만 포함}
        '401': {description: 유효한 로그인 세션 없음}
  /api/v1/diagnosis/attempts:
    get:
      summary: 본인의 완료 진단 기록 조회
      security: [{appBearer: []}]
      description: 최신순으로 최대 20건을 반환한다. 다음 페이지는 직전 마지막 항목의 completedAt과 id를 함께 보낸다.
      parameters:
        - in: query
          name: before
          schema: {type: string, format: date-time}
        - in: query
          name: beforeId
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: 완료 기록 페이지
          content:
            application/json:
              schema:
                type: object
                required: [items, hasMore]
                properties:
                  hasMore: {type: boolean}
                  items:
                    type: array
                    maxItems: 20
                    items:
                      type: object
                      required: [id, attemptId, completedAt, score, representativeType]
                      properties:
                        id: {type: string, format: uuid}
                        attemptId: {type: string, format: uuid}
                        completedAt: {type: string, format: date-time}
                        score: {type: integer, minimum: 0, maximum: 100}
                        representativeType:
                          type: string
                          enum: [DEBT, INCOME, EMERGENCY_FUND, FIXED_COST, FUTURE, FAMILY]
        '400': {description: 잘못된 커서}
        '401': {description: 인증 필요}
  /api/v1/diagnosis/monthly-report:
    get:
      operationId: getMonthlyReport
      summary: 본인의 월간 리포트 조회
      description: 한국시간 달력월을 기준으로 집계하며 익월 1일 09시에 마감한다. 완료 진단이 없으면 available은 false다.
      security: [{appBearer: []}]
      parameters:
        - in: query
          name: month
          description: 생략하면 현재 달을 조회한다.
          schema: {type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'}
      responses:
        '200':
          description: 요청한 달의 진단 및 가이드 실천 집계
          content:
            application/json:
              schema:
                type: object
                required: [month, available, provisional, closesAt, diagnosisCount, guideViews, guideCompletions]
                properties:
                  month: {type: string}
                  available: {type: boolean}
                  provisional: {type: boolean}
                  closesAt: {type: string, format: date-time}
                  diagnosisCount: {type: integer, minimum: 0}
                  guideViews: {type: integer, minimum: 0}
                  guideCompletions: {type: integer, minimum: 0}
                  attemptId: {type: [string, 'null'], format: uuid}
                  completedAt: {type: [string, 'null'], format: date-time}
                  firstScore: {type: [integer, 'null'], minimum: 0, maximum: 100}
                  scoreChange: {type: [integer, 'null'], minimum: -100, maximum: 100}
                  result: {type: [object, 'null'], description: 마지막 회차의 점수·유형·영역별 결과}
        '400': {description: 잘못된 월 형식 또는 미래 월}
        '401': {description: 인증 필요}
  /api/v1/admin/auth/csrf:
    get:
      summary: 관리자 쓰기 요청에 사용할 CSRF 토큰 조회
      description: 응답의 headerName을 헤더 이름으로 사용하고 token을 값으로 보낸다. 쓰기 요청에는 발급 쿠키와 관리자 사이트의 Origin도 필요하다.
      responses:
        '200':
          description: CSRF 토큰과 요청 헤더 이름
          content:
            application/json:
              schema:
                type: object
                required: [token, headerName]
                properties:
                  token: {type: string}
                  headerName: {type: string}
  /api/v1/admin/auth/reset-request:
    post:
      operationId: requestAdminPasswordReset
      summary: 관리자 비밀번호 재설정 링크 요청
      description: 계정 유무·활성 상태·발급 한도에 관계없이 유효한 요청은 동일하게 202를 반환한다.
      parameters:
        - in: header
          name: X-XSRF-TOKEN
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email, maxLength: 254}
      responses:
        '202': {description: 요청 접수}
        '400': {description: 입력 형식 오류}
        '403': {description: CSRF 또는 출처 검사 실패}
  /api/v1/admin/auth/reset:
    post:
      operationId: completeAdminPasswordReset
      summary: 관리자 비밀번호 변경
      description: 15분 일회용 토큰을 소비하고 기존 세션·로그인 도전을 폐기한다. 다음 로그인에는 MFA가 필요하다.
      parameters:
        - in: header
          name: X-XSRF-TOKEN
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
                newPassword: {type: string, format: password, minLength: 12, maxLength: 128}
      responses:
        '204': {description: 비밀번호 변경 완료}
        '400': {description: 입력 형식 오류}
        '403': {description: CSRF 또는 출처 검사 실패}
        '404': {description: 유효한 재설정 링크 없음}
        '422': {description: 비밀번호 정책 위반}
        '503': {description: 설정된 유출 비밀번호 검사 서비스를 사용할 수 없음}
  /api/v1/admin/media:
    post:
      summary: 뉴스 이미지 검증과 등록
      description: OPERATOR 권한이 필요하다. JPG·PNG·WebP 원본은 10MB 및 4096×4096 이하이며 재인코딩한 정적 이미지만 저장한다.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '201':
          description: 검증을 통과한 이미지
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminMediaAsset'}
        '403': {description: 권한·CSRF·출처 검사 실패}
        '413': {description: 파일 최대 크기 초과}
        '422': {description: 형식·MIME·크기 또는 디코딩 검증 실패}
  /api/v1/admin/media/{id}:
    get:
      summary: 이미지 검증 상태와 미리보기 경로
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: 업로더 또는 연결된 뉴스 편집·검토 담당자에게 제공하는 이미지 정보
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminMediaAsset'}
        '404': {description: 조회할 수 있는 이미지 없음}
  /api/v1/admin/media/{id}/file:
    get:
      summary: 관리자 이미지 미리보기
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: 재인코딩된 이미지
          content:
            image/jpeg:
              schema: {type: string, format: binary}
            image/png:
              schema: {type: string, format: binary}
        '404': {description: 조회할 수 있는 이미지 없음}
  /api/v1/admin/contents:
    get:
      summary: 공지·가이드·인사이트 버전 목록 조회
      description: OPERATOR, SUPER_ADMIN 또는 ANALYST 역할이 필요하다.
      parameters:
        - {in: query, name: kind, schema: {enum: [NOTICE, GUIDE, INSIGHT], default: NOTICE}}
        - {in: query, name: status, schema: {enum: [DRAFT, IN_REVIEW, APPROVED, SCHEDULED, PUBLISHED, UNPUBLISHED, EXPIRED, ARCHIVED]}}
        - {in: query, name: type, schema: {type: string}}
        - {in: query, name: q, schema: {type: string}}
        - {in: query, name: authorId, schema: {type: string, format: uuid}}
        - {in: query, name: from, schema: {type: string, format: date}}
        - {in: query, name: to, schema: {type: string, format: date}}
      responses:
        '200': {description: 조건에 맞는 콘텐츠 버전 목록}
    post:
      summary: 공지·가이드·인사이트 초안 작성
      description: OPERATOR 역할이 필요하다. contentId와 restoreFrom으로 이전 버전을 새 초안으로 복원할 수 있다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: {enum: [NOTICE, GUIDE, INSIGHT]}
                contentId: {type: string, format: uuid}
                restoreFrom: {type: string, format: uuid}
                fields:
                  type: object
                  required: [title, summary, body, sortOrder]
                  properties:
                    title: {type: string, minLength: 1, maxLength: 80}
                    summary: {type: string, minLength: 1, maxLength: 300}
                    body: {type: string, minLength: 1, maxLength: 10000}
                    sortOrder: {type: integer, minimum: 0, maximum: 999}
