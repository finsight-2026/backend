        - *editorial_path_id
      responses:
        '200': {description: 버전 번호 내림차순 목록}
        '404': {description: 기사 없음}
  /api/v1/admin/news/{id}/{revision}/transitions:
    post:
      summary: 경제 뉴스 버전 상태 전환
      description: 작성자는 초안을 보관할 수 있다. 최고관리자는 비공개·만료 버전 보관과 예약·예약 취소를 할 수 있다. 검토 요청·회수 외 작업에는 멱등 키가 필요하다. 게시·예약에는 미리보기 확인이 필요하다.
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
        - {in: path, name: revision, required: true, schema: {type: integer, minimum: 1}}
        - {in: header, name: Idempotency-Key, schema: {type: string, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, expectedVersion]
              properties:
                action: {enum: [SUBMIT, WITHDRAW, APPROVE, REJECT, PUBLISH, SCHEDULE, CANCEL_SCHEDULE, UNPUBLISH, ARCHIVE]}
                expectedVersion: {type: integer, format: int64}
                reason: {type: string, maxLength: 500}
                startsAt: {type: string, format: date-time}
                endsAt: {type: string, format: date-time}
                previewConfirmed: {type: boolean}
      responses:
        '200': {description: 전환된 기사 버전}
        '403': {description: 역할·작성자 또는 요청 검증 실패}
        '409': {description: 상태·버전 또는 멱등 키 충돌}
  /api/v1/admin/news-editions:
    get:
      summary: 날짜와 유형에 해당하는 뉴스 편성 후보 및 현재 슬롯
      description: SUPER_ADMIN 역할이 필요하다.
      parameters:
        - {in: query, name: date, required: true, schema: {type: string, format: date}}
        - {in: query, name: type, required: true, schema: {type: string}}
      responses:
        '200':
          description: 편성 가능한 게시·예약 기사 버전과 저장된 슬롯·편성 버전
          content:
            application/json:
              schema:
                type: object
                required: [options, slots, version]
                properties:
                  version: {type: integer, format: int64, minimum: 0}
                  slots:
                    type: array
                    items: {$ref: '#/components/schemas/NewsEditionSlot'}
                  options:
                    type: array
                    items:
                      type: object
                      required: [contentId, revisionId, title, status]
                      properties:
                        contentId: {type: string, format: uuid}
                        revisionId: {type: integer, minimum: 1}
                        title: {type: string}
                        status: {enum: [PUBLISHED, SCHEDULED]}
        '403': {description: 최고관리자 권한 없음}
  /api/v1/admin/news-editions/{date}/{type}:
    put:
      summary: 선택한 기사 버전을 편성 슬롯에 고정
      description: SUPER_ADMIN 역할이 필요하다. 같은 기사를 여러 슬롯에 넣을 수 없다.
      parameters:
        - {in: path, name: date, required: true, schema: {type: string, format: date}}
        - {in: path, name: type, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slots, expectedVersion]
              properties:
                expectedVersion: {type: integer, format: int64, minimum: 0}
                slots:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items:
                    allOf:
                      - {$ref: '#/components/schemas/NewsEditionSlot'}
                      - type: object
                        properties:
                          revisionId: {type: integer, minimum: 1}
      responses:
        '200': {description: 편성 날짜·유형·저장된 슬롯·새 편성 버전}
        '403': {description: 역할·출처 또는 CSRF 검증 실패}
        '409': {description: 편성 버전 충돌}
        '422': {description: 편성 날짜·슬롯 또는 기사 버전이 유효하지 않음}
  /api/v1/admin/contents/insight-sources:
