        - &editorial_revision {in: query, name: revision, schema: {type: integer, minimum: 1}, description: '생략하면 최신 버전'}
      responses:
        '200': {description: 선택 버전과 현재 공개 버전 정보}
        '404': {description: 종류·ID·버전에 해당하는 콘텐츠가 없음}
  /api/v1/admin/news/candidates:
    get:
      summary: 한국경제 수집 후보와 당일 수집 결과 조회
      description: OPERATOR 또는 SUPER_ADMIN 권한이 필요하다. 최근 72시간의 미작성 후보 최대 30개를 최신순으로 반환한다.
      responses:
        '200':
          description: 후보 목록과 당일 수집 상태
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [sourceUrl, title, articlePublishedAt, collectedAt]
                      properties:
                        sourceUrl: {type: string, format: uri}
                        title: {type: string}
                        articlePublishedAt: {type: string, format: date-time}
                        collectedAt: {type: string, format: date-time}
                  collection:
                    type: [object, 'null']
                    properties:
                      status: {type: string, enum: [QUEUED, COMPLETED, FAILED]}
                      attempts: {type: integer}
                      nextRunAt: {type: string, format: date-time}
                      completedAt: {type: string, format: date-time}
                      acceptedCount: {type: integer}
                      errorCode: {type: string}
        '401': {description: 관리자 인증 필요}
        '403': {description: 뉴스 후보 조회 권한 없음}
  /api/v1/admin/news/page:
    get:
      summary: 경제 뉴스 운영 목록 페이지
      description: OPERATOR 또는 SUPER_ADMIN 역할이 필요하다. 필터에 맞는 기사당 최신 버전 하나를 반환한다.
      parameters:
        - {in: query, name: status, schema: {type: string, enum: [DRAFT, IN_REVIEW, APPROVED, SCHEDULED, PUBLISHED, UNPUBLISHED, EXPIRED, ARCHIVED]}}
        - *editorial_type
        - *editorial_q
        - *editorial_author
        - *editorial_from
        - *editorial_to
        - *editorial_page
        - *editorial_size
      responses:
        '200': {description: items·total·page·size 및 작업 버전·공개 버전·수정자 정보}
        '422': {description: 페이지 또는 필터 범위 오류}
  /api/v1/admin/news/{id}:
    get:
      summary: 경제 뉴스 상세 버전 조회
      parameters:
        - &editorial_path_id {in: path, name: id, required: true, schema: {type: string, format: uuid}}
