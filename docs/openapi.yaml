        '409': {description: 대상 기기 없음 또는 멱등 키 충돌}
        '422': {description: 사유 또는 멱등 키 누락이나 형식 오류}
  /api/v1/admin/deletion-requests/{id}:
    get:
      summary: PRIVACY 권한으로 데이터 삭제 또는 탈퇴 처리 상태 조회
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: 개인정보를 제외한 삭제 상태와 처리 시각
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
                  kind: {type: string, enum: [DATA_DELETION, ACCOUNT_WITHDRAWAL]}
                  status: {type: string, enum: [SCHEDULED, COMPLETED, CANCELED, FAILED]}
                  stage: {type: string, enum: [GRACE_PERIOD, AWAITING_PURGE, PURGE_RETRY_WAIT, PURGE_REVIEW_REQUIRED, COMPLETED, CANCELED]}
                  dueAt: {type: string, format: date-time}
                  nextRunAt: {type: string, format: date-time}
                  retryCount: {type: integer}
                  requeueCount: {type: integer, minimum: 0, description: 운영자 재접수 횟수}
                  retryable: {type: boolean, description: 실패한 삭제 작업이 여전히 대상 계정에 연결되어 있으며 재접수 가능함}
                  errorCode: {type: string}
                  overdue: {type: boolean}
                  deadlineWarning: {type: boolean, description: 미완료 상태에서 처리 기한이 1시간 이내}
        '403': {description: PRIVACY 권한 없음}
        '404': {description: 조회 가능한 삭제 작업 없음}
  /api/v1/admin/deletion-requests/{id}/retry:
    post:
      summary: 실패한 삭제 작업을 검토 후 같은 작업 ID로 다시 접수
      description: 현재 PRIVACY 역할을 검사한다. 원래 처리 기한과 접근 차단을 유지하며 백엔드 작업이 삭제를 실행한다.
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, expectedRequeueCount]
              properties:
                reason: {type: string, minLength: 1, maxLength: 500}
                expectedRequeueCount: {type: integer, minimum: 0}
      responses:
        '202': {description: 다시 접수한 작업 상태와 재접수 횟수}
        '400': {description: 재접수 횟수 누락 또는 형식 오류}
        '401': {description: 관리자 인증 필요}
        '403': {description: PRIVACY 권한·CSRF·출처 검사 실패}
        '404': {description: 조회 가능한 삭제 작업 없음}
        '409': {description: 작업·계정 상태 변경 또는 멱등 키 충돌}
        '422': {description: 사유 또는 멱등 키 누락이나 형식 오류}
  /api/v1/admin/comparison-snapshots:
    get:
      summary: 익명 비교 집계 목록
      parameters:
        - {in: query, name: type, schema: {type: string}}
        - in: query
          name: status
          schema: {type: string, enum: [BUILDING, READY, FAILED, IN_REVIEW, APPROVED, INVALIDATED]}
      responses:
        '200':
          description: 집계 목록과 현재 재시도 상태
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ComparisonSnapshot'}
        '403': {description: 운영자 또는 최고관리자 권한 없음}
  /api/v1/admin/comparison-snapshots/{id}:
    get:
      summary: 익명 비교 집계 상세
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: 집계 상태 및 익명 집계 지표
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ComparisonSnapshot'}
        '403': {description: 운영자 또는 최고관리자 권한 없음}
        '404': {description: 집계 작업 없음}
  /api/v1/admin/comparison-snapshots/{id}/preview:
    get:
      summary: 익명 비교의 앱 공개 지표 미리보기
      description: 현재 정책과 표본을 충족하는 지표만 반환한다. 승인된 집계는 승인 지표와 공개 기간을 적용한다.
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: 집계 버전, 공개 가능 지표 및 승인된 기간
          content:
            application/json:
              schema:
                type: object
                required: [version, metrics, startsAt, endsAt]
                properties:
                  version: {type: integer, format: int64}
                  metrics:
                    type: object
                    additionalProperties:
                      oneOf:
                        - {type: number}
                        - {type: object, additionalProperties: {type: number}}
                  startsAt: {type: [string, 'null'], format: date-time}
                  endsAt: {type: [string, 'null'], format: date-time}
        '401': {description: 관리자 세션 없음}
        '403': {description: 운영자 또는 최고관리자 권한 없음}
        '404': {description: 집계 작업 없음}
  /api/v1/admin/jobs:
    get:
      summary: 역할 범위의 백오피스 작업 목록
      parameters:
        - in: query
          name: status
          schema: {type: string, enum: [PENDING, QUEUED, RUNNING, SCHEDULED, SENDING, COMPLETED, FAILED, PARTIAL_FAILED, CANCELED, CANCEL_REQUESTED]}
        - {in: query, name: kind, schema: {type: string}}
        - {in: query, name: actorId, schema: {type: string, format: uuid}}
        - {in: query, name: from, schema: {type: string, format: date}}
        - {in: query, name: to, schema: {type: string, format: date}}
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: size, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200': {description: 작업 목록과 페이지 정보. 처리 중인 집계 내보내기는 RUNNING으로 표시한다.}
        '401': {description: 관리자 인증 필요}
        '403': {description: 작업 조회 권한 없음}
        '422': {description: 페이지 또는 조회 기간 오류}
  /api/v1/admin/jobs/{id}:
    get:
      summary: 역할과 요청자 범위의 작업 상세
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: 작업 상세. 집계 내보내기가 RUNNING이면 현재 실행의 시작 시각을 반환한다.}
        '401': {description: 관리자 인증 필요}
        '403': {description: 작업 조회 권한 없음}
        '404': {description: 조회 가능한 작업 없음}
  /api/v1/admin/jobs/{id}/retry:
    post:
      summary: 재시도할 수 있는 실패 집계 내보내기를 같은 작업 ID로 다시 접수
      description: 원 요청자의 현재 ANALYST 역할과 활성 계정을 검사한다. 작업을 다시 조회하면 retryCount와 nextRunAt을 확인할 수 있다.
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 500}
      responses:
        '202': {description: '같은 작업 ID, 접수 상태 및 파일 형식'}
        '403': {description: 역할·CSRF·출처 검사 실패}
        '404': {description: 본인의 재시도 대상 내보내기가 없음}
        '409': {description: '재시도 불가 상태, 이미 대기 중인 동일 범위 또는 멱등 키 충돌'}
        '422': {description: 사유 또는 멱등 키 누락이나 형식 오류}
  /api/v1/admin/exports/masked-users/preview:
    post:
      summary: 마스킹 사용자 CSV 대상 미리보기
      description: 운영자의 필터 전체 대상을 10분 동안 고정한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/paths/~1api~1v1~1admin~1campaigns~1target-preview/post/requestBody/content/application~1json/schema'
      responses:
        '200':
          description: 확정 대상과 제외 건수
          content:
            application/json:
              schema:
                type: object
                required: [previewId, total, eligible, excluded, expiresAt]
                properties:
                  previewId: {type: string, format: uuid}
                  total: {type: integer}
                  eligible: {type: integer}
                  excluded: {type: integer}
                  expiresAt: {type: string, format: date-time}
        '403': {description: 운영자 권한 없음}
  /api/v1/admin/exports/masked-users:
    post:
      summary: 마스킹 사용자 목록 CSV 작업 생성
      description: 운영자가 선택한 사용자 또는 미리보기에서 확정한 대상을 CSV로 만든다. 이전 클라이언트의 필터 직접 요청도 지원한다.
      parameters:
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userIds: {type: array, minItems: 1, maxItems: 100, items: {type: string, format: uuid}}
                previewId: {type: string, format: uuid}
                filter:
                  $ref: '#/paths/~1api~1v1~1admin~1campaigns~1target-preview/post/requestBody/content/application~1json/schema'
              oneOf:
                - required: [userIds]
                - required: [filter]
                - required: [previewId]
      responses:
        '202': {description: CSV 작업 접수}
        '403': {description: 운영자 권한 없음}
        '404': {description: 본인의 유효한 CSV 미리보기가 없음}
        '409': {description: 사용할 수 있는 대상 없음 또는 요청 충돌}
  /api/v1/admin/exports:
    post:
      summary: 관리자 집계 또는 개인정보 원문 내보내기 요청
      description: |
        콘텐츠 성과와 대시보드 집계는 ANALYST 역할이 필요하다.
        PII_RAW는 CSV만 지원한다. PRIVACY 역할, 최근 5분 내 MFA, 10~500자 사유와 같은 세션에 발급된 열람권이 필요하다.
        filter에는 userId와 scope가 필수다. ANSWERS인 경우 diagnosisId가 필수이며 PROFILE에는 diagnosisId를 보내지 않는다.
        열람권은 요청 범위와 EXPORT를 함께 포함해야 한다. 작업 상태는 `/api/v1/admin/jobs/{id}`에서 조회한다.
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/AdminCsrfToken'
        - in: header
          name: Idempotency-Key
          description: CONTENT_PERFORMANCE 요청에 필수. 동일 키와 동일 요청은 기존 작업을 반환한다.
          schema: {type: string, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, format]
              properties:
                kind: {enum: [DASHBOARD_AGGREGATE, CONTENT_PERFORMANCE, PII_RAW]}
                format: {enum: [CSV, PDF]}
                columns: {type: array, items: {type: string}}
                reason: {type: string}
                grantId: {type: string, format: uuid}
                filter:
                  type: object
                  properties:
                    from: {type: string, format: date}
                    to: {type: string, format: date}
                    age: {type: string}
                    type: {enum: [DEBT, INCOME, EMERGENCY_FUND, FIXED_COST, FUTURE, FAMILY]}
                    kind: {enum: [NEWS, GUIDE, INSIGHT]}
                    contentId: {type: string, maxLength: 80}
                    revision: {type: integer, minimum: 1}
                    combineVersions: {type: boolean}
                    userId: {type: string, format: uuid}
                    diagnosisId: {type: string, format: uuid}
                    scope: {enum: [PROFILE, ANSWERS]}
      responses:
        '202':
          description: 작업 ID와 상태 및 파일 형식
          content:
            application/json:
              schema:
                type: object
                required: [id, status, format]
                properties:
                  id: {type: string, format: uuid}
                  status: {type: string}
                  format: {type: string, enum: [CSV, PDF]}
        '401': {description: 관리자 세션 필요}
        '403': {description: 역할·CSRF·출처·열람권 검사 실패}
        '404': {description: 요청한 진단 회차 없음}
        '409': {description: 같은 범위에 충돌하는 작업이 있거나 멱등 키가 다른 요청에 사용됨}
        '422': {description: 요청 종류와 맞지 않는 필터·컬럼 또는 필수 입력 오류}
        '428': {description: 개인정보 원문 내보내기에 최근 MFA 필요}
        '503': {description: 개인정보 내보내기 암호화 키 미구성}
  /api/v1/admin/users/{user}/pii-grants:
    post:
      summary: 특정 사용자에 대한 10분 개인정보 열람권 발급
      description: PRIVACY 역할과 최근 5분 내 MFA가 필요하다. 사유는 암호화해서 저장한다. CSV 내보내기에는 EXPORT와 조회 범위를 함께 요청한다.
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/AdminCsrfToken'
        - {in: path, name: user, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, scope]
              properties:
                reason: {type: string, minLength: 10, maxLength: 500}
                scope:
                  type: array
                  minItems: 1
                  maxItems: 3
                  uniqueItems: true
                  items: {type: string, enum: [PROFILE, ANSWERS, EXPORT]}
      responses:
        '201':
          description: 발급한 열람권 ID와 만료 시각. 응답은 캐시하지 않는다.
          content:
            application/json:
              schema:
                type: object
                required: [grantId, expiresAt]
                properties:
                  grantId: {type: string, format: uuid}
                  expiresAt: {type: string, format: date-time}
        '401': {description: 관리자 세션 필요}
        '403': {description: 역할·CSRF·출처 검사 실패}
        '404': {description: 대상 사용자가 없거나 데이터 삭제 대기 중}
        '422': {description: 사유 또는 범위 오류}
        '428': {description: 최근 MFA 필요}
        '503': {description: 개인정보 열람 사유 암호화 키 미구성}
  /api/v1/admin/users/{user}/pii-grants/{grantId}:
    delete:
      summary: 발급한 개인정보 열람권 종료
      description: 현재 관리자 세션과 대상 사용자에 속한 열람권을 종료하고 연결된 원문 CSV 파일과 링크를 폐기한다.
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/AdminCsrfToken'
        - {in: path, name: user, required: true, schema: {type: string, format: uuid}}
        - {in: path, name: grantId, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: 열람권 종료 처리. 같은 요청을 다시 보내도 204를 반환한다.}
        '401': {description: 관리자 세션 필요}
        '403': {description: 역할·CSRF·출처 검사 실패}
  /api/v1/admin/users/{user}/pii:
    get:
      summary: 열람권 범위 내 개인정보 원문 조회
      description: 현재 관리자 세션과 사용자에 연결된 열람권을 검사한다. 진단 회차 조회에는 ANSWERS 범위가 필요하다.
      security:
        - adminSession: []
      parameters:
        - {in: path, name: user, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: grantId, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: diagnosisId, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: 허용된 프로필과 선택한 회차의 원응답. 응답은 캐시하지 않는다.
          content:
            application/json:
              schema:
                type: object
                required: [answers, expiresAt]
                properties:
                  profile:
                    type: [object, 'null']
                    properties:
                      email: {type: string, format: email}
                      attributes: {type: object, additionalProperties: true}
                  diagnosisId: {type: [string, 'null'], format: uuid}
                  answers:
                    type: array
                    items:
                      type: object
                      required: [questionNo, response]
                      properties:
                        questionNo: {type: integer}
                        response: {type: integer}
                  expiresAt: {type: string, format: date-time}
        '401': {description: 관리자 세션 필요}
        '403': {description: 역할 또는 열람권 검사 실패}
        '404': {description: 조회할 사용자 또는 진단 회차 없음}
        '422': {description: 응답만 조회할 수 있는 열람권으로 진단 회차를 지정하지 않음}
  /api/v1/admin/exports/{id}/download:
    post:
      summary: 완료된 내보내기의 다운로드 링크 발급
      description: 본인이 요청한 작업과 현재 역할을 확인한다. 개인정보 원문은 grantId와 유효한 열람권이 필요하다. 링크는 5분 이내에 만료된다.
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/AdminCsrfToken'
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                grantId: {type: string, format: uuid}
      responses:
        '200':
          description: 서명된 상대 URL과 만료 시각. 응답은 캐시하지 않는다.
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresAt]
                properties:
                  url: {type: string, format: uri-reference}
                  expiresAt: {type: string, format: date-time}
        '401': {description: 관리자 세션 필요}
        '403': {description: 역할·CSRF·출처·열람권 검사 실패}
        '404': {description: 요청자에게 제공할 완료 파일이 없음}
  /api/v1/admin/exports/{id}/file:
    get:
      summary: 발급된 링크로 내보내기 파일 다운로드
      description: 발급된 서명 URL을 사용한다. 관리자 세션, 현재 역할, 요청자, 링크와 파일의 만료를 다시 검사한다. 개인정보 CSV는 열람권 검사도 다시 수행한다.
      security:
        - adminSession: []
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: token, required: true, schema: {type: string}}
        - {in: query, name: signature, required: true, schema: {type: string}}
        - {in: query, name: pii, schema: {type: boolean, default: false}}
      responses:
        '200':
          description: 첨부 파일
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            Referrer-Policy: {schema: {type: string, const: no-referrer}}
            Content-Disposition: {schema: {type: string}}
          content:
            text/csv:
              schema: {type: string}
            application/pdf: {}
        '401': {description: 관리자 세션 필요}
        '403': {description: 역할 또는 열람권 검사 실패}
        '404': {description: 파일이 없거나 서명 또는 만료 검사에 실패함}
  /api/v1/admin/experiments:
    get:
      summary: 실험 목록과 앱 표시안 지원 상태 조회
      description: OPERATOR, SUPER_ADMIN 또는 ANALYST 역할이 필요하다.
      responses:
        '200':
          description: 실험 목록 및 지원 화면
          content:
            application/json:
              schema:
                type: object
                required: [items, capability]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ScreenExperiment'}}
                  capability:
                    type: object
                    required: [screenId, variants, enabled]
                    properties:
                      screenId: {const: B_006}
                      variants: {type: array, items: {$ref: '#/components/schemas/ExperimentVariant'}}
                      enabled: {type: boolean}
    post:
      summary: 실험 초안 작성
      description: OPERATOR 역할이 필요하다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExperimentFields'}
      responses:
        '201':
          description: 실험 초안
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScreenExperiment'}
        '403': {description: 역할 또는 CSRF·출처 검사 실패}
        '422': {description: 기간 또는 표시안 구성 오류}
  /api/v1/admin/experiments/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      summary: 실험 초안 수정
      description: OPERATOR 역할이 필요하다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fields, expectedVersion]
              properties:
                fields: {$ref: '#/components/schemas/ExperimentFields'}
                expectedVersion: {type: integer, minimum: 0}
      responses:
        '200':
          description: 수정한 초안
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScreenExperiment'}
        '409': {description: 버전 충돌 또는 초안이 아닌 실험}
  /api/v1/admin/experiments/{id}/transitions:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: 실험 활성화·일시정지·종료
      description: SUPER_ADMIN 역할이 필요하다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, reason, expectedVersion]
              properties:
                action: {enum: [ACTIVATE, PAUSE, END]}
                reason: {type: string, minLength: 1, maxLength: 300}
                expectedVersion: {type: integer, minimum: 0}
      responses:
        '200':
          description: 변경한 상태
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScreenExperiment'}
        '409': {description: 상태·버전·기능 플래그 또는 활성 실험 충돌}
  /api/v1/admin/experiments/{id}/results:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      summary: 실험 표시안별 최초 노출과 진단 완료 집계
      description: OPERATOR, SUPER_ADMIN 또는 ANALYST 역할이 필요하다.
      responses:
        '200':
          description: 실험 기간과 표시안별 분모·분자
          content:
            application/json:
              schema:
                type: object
                required: [experiment, variants]
                properties:
                  experiment: {$ref: '#/components/schemas/ScreenExperiment'}
                  variants:
                    type: array
                    items:
                      type: object
                      required: [variantId, exposed, completed]
                      properties:
                        variantId: {$ref: '#/components/schemas/ExperimentVariant'}
                        exposed: {type: integer, minimum: 0}
                        completed: {type: integer, minimum: 0}
  /api/v1/experiments/assign:
    post:
      summary: 로그인 사용자에게 앱 표시안 배정
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExperimentJourney'}
      responses:
        '200':
          description: 서버 배정
          content:
            application/json:
              schema:
                type: object
                required: [experimentId, screenId, variantId]
                properties:
                  experimentId: {type: string, format: uuid}
                  screenId: {const: B_006}
                  variantId: {$ref: '#/components/schemas/ExperimentVariant'}
        '204': {description: 적용할 실험 없음}
        '404': {description: 소유한 진단 여정 없음}
  /api/v1/experiments/{id}/exposure:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      summary: 앱에 표시된 배정안의 최초 노출 등록
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/ExperimentJourney'}
                - type: object
                  required: [variantId]
                  properties:
                    variantId: {$ref: '#/components/schemas/ExperimentVariant'}
      responses:
        '204': {description: 등록 완료 또는 같은 실험의 기존 최초 노출 유지}
        '404': {description: 소유 여정·배정 불일치 또는 노출 기간 종료}
  /api/v1/admin/audit-logs:
    get:
      operationId: listAdminAuditLogs
      summary: 관리자 감사 기록 조회
      description: SUPER_ADMIN 또는 PRIVACY 역할이 필요하다. 날짜는 KST이며 시작일과 종료일을 포함한다.
      parameters:
        - {in: query, name: actorId, schema: {type: string, format: uuid}}
        - {in: query, name: action, schema: {type: string}}
        - {in: query, name: targetId, schema: {type: string}}
        - {in: query, name: result, schema: {type: string}}
        - {in: query, name: reason, schema: {type: string, maxLength: 500}}
        - {in: query, name: from, schema: {type: string, format: date}}
        - {in: query, name: to, schema: {type: string, format: date}}
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: size, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: 감사 기록 페이지
          content:
            application/json:
              schema:
                type: object
                required: [items, page, size, total]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, actorId, roles, action, targetType, targetId, result, changes, traceId, createdAt, targetRemoved]
                      properties:
                        id: {type: string, format: uuid}
                        actorId: {type: string, format: uuid}
                        roles: {type: array, items: {type: string}}
                        action: {type: string}
                        targetType: {type: string}
                        targetId: {type: string}
                        result: {type: string}
                        changes: {type: object, additionalProperties: true}
                        traceId: {type: string, format: uuid}
                        createdAt: {type: string, format: date-time}
                        targetRemoved:
                          type: boolean
                          description: 사용자 대상의 계정이 현재 존재하지 않으면 true
                  page: {type: integer}
                  size: {type: integer}
                  total: {type: integer, format: int64}
        '401': {description: 관리자 세션이 없거나 만료됨}
        '403': {description: 감사 기록 조회 권한 없음}
        '422': {description: 조회 조건 범위 오류}
  /api/v1/admin/events:
    get:
      operationId: listAdminEvents
      summary: 앱 운영 이벤트 조회
      description: OPERATOR 역할이 있는 관리자만 조회할 수 있다. 기간은 KST 발생일 기준으로 양끝을 포함한다.
      parameters:
        - {in: query, name: eventId, schema: {type: string, format: uuid}}
        - {in: query, name: userId, schema: {type: string, format: uuid}}
        - {in: query, name: attemptId, schema: {type: string, format: uuid}}
        - {in: query, name: journeyId, schema: {type: string, format: uuid}}
        - in: query
          name: type
          description: 이벤트 종류. USER_DELETION_REQUESTED와 USER_WITHDRAWAL_REQUESTED는 서버에 접수된 신청을 나타낸다.
          schema: {type: string}
        - {in: query, name: from, schema: {type: string, format: date}}
        - {in: query, name: to, schema: {type: string, format: date}}
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: size, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: 허용 필드의 이벤트와 페이지 정보
          content:
            application/json:
              schema:
                type: object
                required: [items, page, size, total]
                properties:
                  page: {type: integer}
                  size: {type: integer}
                  total: {type: integer, format: int64}
                  items:
                    type: array
                    items:
                      type: object
                      required: [eventId, eventName, userId, occurredAt, receivedAt, clockAdjusted, properties]
                      properties:
                        eventId: {type: string, format: uuid}
                        eventName: {type: string}
                        userId: {type: string, format: uuid}
                        attemptId: {type: string, format: uuid}
                        journeyId: {type: string, format: uuid}
                        diagnosisId: {type: string, format: uuid}
                        contentId: {type: string}
                        notificationId: {type: string, format: uuid}
                        occurredAt: {type: string, format: date-time}
                        receivedAt: {type: string, format: date-time}
                        clockAdjusted: {type: boolean}
                        experimentId: {type: string, format: uuid}
                        screenId: {type: string}
                        variantId: {type: string}
                        properties:
                          type: object
                          properties:
                            questionNo: {type: integer, minimum: 1, maximum: 30}
                            activeMs: {type: integer, minimum: 0, maximum: 86400000}
                            activityDate: {type: string, format: date}
                            month: {type: string, format: date}
                            value: {type: boolean}
        '401': {description: 관리자 인증 필요}
        '403': {description: 이벤트 조회 권한 없음}
        '422': {description: 조회 기간 또는 페이지 범위 오류}
components:
  parameters:
    AdminCsrfToken:
      in: header
      name: X-XSRF-TOKEN
      required: true
      description: 관리자 CSRF 조회에서 받은 토큰. 발급 쿠키와 관리자 사이트의 Origin을 함께 보낸다.
      schema: {type: string}
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: __Secure-FINSIGHT_ADMIN
    appBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    ContentEventEpoch:
      description: 현재 로그인 계정의 콘텐츠 이벤트 세대. 다음에 발생하는 이벤트에 적용한다.
      schema: {type: integer, format: int64, minimum: 0}
  requestBodies:
    SocialStart:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [provider, purpose]
            properties:
              provider: {$ref: '#/components/schemas/SocialProvider'}
              purpose: {type: string, enum: [LOGIN, LINK, REAUTH, CANCEL_WITHDRAWAL]}
              confirmed: {type: boolean, description: 탈퇴 취소를 명시적으로 확인한 경우에만 true}
    SocialFinish:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [state, verifier]
            properties:
              state: {$ref: '#/components/schemas/SocialSecret'}
              verifier: {$ref: '#/components/schemas/SocialSecret'}
    ContentEvent:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [eventId, action, revision, occurredAt]
            properties:
              eventId: {type: string, format: uuid}
              action: {type: string, enum: [IMPRESSION, VIEWED]}
              revision: {type: integer, minimum: 1}
              viewSessionId: {type: string, format: uuid, description: 노출 이벤트에서만 필수}
              occurredAt: {type: string, format: date-time}
              contentEventEpoch:
                type: integer
                format: int64
                minimum: 0
                description: 이벤트 생성 시 앱이 알고 있던 세대. 생략 시 0이며 요청을 재시도할 때 같은 값을 유지한다.
  responses:
    SocialStart:
      description: 제공자 인증 주소와 앱에서만 보관하는 확인값
      content:
        application/json:
          schema:
            type: object
            required: [authorizationUrl, state, verifier]
            properties:
              authorizationUrl: {type: string, format: uri}
              state: {$ref: '#/components/schemas/SocialSecret'}
              verifier: {$ref: '#/components/schemas/SocialSecret'}
    SocialCallback:
      description: iOS 시스템 인증 창으로 돌아갈 URL. 결과와 토큰은 별도 HTTPS 요청에서 받는다.
      headers:
        Location:
          required: true
          schema: {type: string, format: uri}
    SocialOutcome:
      description: 소셜 인증 또는 가입·연결 결과
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status:
                type: string
                enum: [AUTHENTICATED, ONBOARDING, CREATED, LINKED, UNLINKED, REAUTHENTICATED, WITHDRAWAL_PENDING, WITHDRAWAL_CANCELED, CANCELED, FAILED, EXPIRED, INVALID_INPUT, INVALID_CODE, EXPIRED_CODE, POLICY_CHANGED, EXISTING_ACCOUNT, REAUTH_REQUIRED, IDENTITY_IN_USE, LAST_CREDENTIAL]
              tokens:
                oneOf:
                  - {$ref: '#/components/schemas/AppTokens'}
                  - {type: 'null'}
              onboardingToken: {type: [string, 'null'], pattern: '^[A-Za-z0-9_-]{43}$'}
              verifiedEmail: {type: [string, 'null'], format: email}
              withdrawalDueAt: {type: [string, 'null'], format: date-time}
    ContentEventResult:
      description: 처리 결과. 이미 받은 이벤트와 이전 세대의 이벤트는 저장하지 않는다.
      headers:
        X-Finsight-Content-Epoch: {$ref: '#/components/headers/ContentEventEpoch'}
    AppTokens:
      description: 앱 액세스 및 회전 리프레시 토큰
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AppTokens'
  schemas:
    AppTokens:
      type: object
      required: [accessToken, refreshToken, expiresIn, contentEventEpoch]
      properties:
        accessToken: {type: string}
        refreshToken: {type: string}
        expiresIn: {type: integer, const: 900}
        contentEventEpoch: {type: integer, format: int64, minimum: 0}
        revocationToken:
          type: [string, 'null']
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: 로그인에서 발급하는 해당 세션 전용 폐기 토큰. 갱신 시 기존 토큰을 계속 사용한다.
    SocialProvider: {type: string, enum: [KAKAO, APPLE]}
    SocialSecret: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
    ComparisonSnapshot:
      type: object
      required: [id, status, datasetVersion, version, retryCount]
      properties:
        id: {type: string, format: uuid}
        type: {type: string}
        from: {type: string, format: date}
        to: {type: string, format: date}
        formulaVersion: {type: string}
        datasetVersion: {type: integer, format: int64}
        version: {type: integer, format: int64}
        sampleSize: {type: integer, minimum: 0}
        excludedSize: {type: integer, minimum: 0}
        metrics: {type: object}
        builtAt: {type: string, format: date-time}
        status: {type: string, enum: [BUILDING, READY, FAILED, IN_REVIEW, APPROVED, INVALIDATED]}
        failureReason: {type: [string, 'null'], enum: [SOURCE_CHANGED, BUILD_FAILED, null]}
        retryCount: {type: integer, minimum: 0, maximum: 3}
        nextRunAt: {type: [string, 'null'], format: date-time}
    NewsEditionSlot:
      type: object
      required: [slot, contentId, revisionId]
      properties:
        slot: {type: integer, minimum: 1, maximum: 3}
        contentId: {type: string, format: uuid}
        revisionId: {type: [integer, 'null'], minimum: 1, description: 과거 편성에서 버전을 확인할 수 없는 경우 null}
    DataDeletionReceipt:
      type: object
      required: [requestId, status, completedAt]
      properties:
        requestId: {type: string, format: uuid}
        status: {type: string, enum: [PENDING, FAILED, COMPLETED]}
        completedAt: {type: [string, 'null'], format: date-time}
    CrmAudiencePreview:
      type: object
      required: [total, consented, deviceCount, eligible, localEligible, excludedByReason, asOf, definitionVersion]
      properties:
        total: {type: integer, format: int64, description: 대상 조건에 일치하는 계정 수}
        consented: {type: integer, format: int64, description: 전체 알림을 허용한 계정 수}
        deviceCount: {type: integer, format: int64, description: 유효한 등록 기기가 한 대 이상인 활성 계정 수}
        eligible: {type: integer, format: int64, description: 알림함 등록 조건을 충족하고 유효한 기기가 있는 계정 수}
        localEligible: {type: integer, format: int64, description: 앱 알림함 등록 조건을 충족하는 계정 수}
        excludedByReason:
          type: object
          additionalProperties: {type: integer, format: int64}
          description: NO_DEVICE는 푸시에서 제외되는 계정 수
        asOf: {type: string, format: date-time}
        definitionVersion: {type: integer}
    PolicyDocument:
      type: object
      required: [id, title, version, effectiveDate, status]
      properties:
        id: {type: string, enum: [terms, privacy-policy, privacy-consent, research]}
        title: {type: string}
        version: {type: string}
        effectiveDate: {type: [string, 'null'], format: date}
        status: {type: string, enum: [CURRENT, HISTORICAL, SCHEDULED, PREVIEW]}
    AdminMediaAsset:
      type: object
      required: [mediaId, status, mime, width, height, previewUrl]
      properties:
        mediaId: {type: string, format: uuid}
        status: {const: READY}
        mime: {enum: [image/jpeg, image/png]}
        width: {type: integer, minimum: 1, maximum: 4096}
        height: {type: integer, minimum: 1, maximum: 4096}
        expiresAt: {type: [string, 'null'], format: date-time}
        previewUrl: {type: string}

    ExperimentVariant:
      type: string
      enum: [SUMMARY_FIRST, RESTART_FIRST]
    ExperimentJourney:
      type: object
      required: [screenId, journeyId]
      properties:
        screenId: {const: B_006}
        journeyId: {type: string, format: uuid}
    ExperimentFields:
      type: object
      required: [name, screenId, variants, startsAt, endsAt]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        screenId: {const: B_006}
        variants:
          type: array
          minItems: 2
          maxItems: 4
          uniqueItems: true
          items: {$ref: '#/components/schemas/ExperimentVariant'}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
    ScreenExperiment:
      allOf:
        - {$ref: '#/components/schemas/ExperimentFields'}
        - type: object
          required: [id, status, version]
          properties:
            id: {type: string, format: uuid}
            status: {enum: [DRAFT, ACTIVE, PAUSED, ENDED]}
            version: {type: integer, minimum: 0}
            endedAt: {type: [string, 'null'], format: date-time}
    Survey:
      type: object
      required: [version, questions]
      properties:
        version:
          type: string
          example: yfsi-ko-v1
        questions:
          type: array
          minItems: 30
          maxItems: 30
          items:
            $ref: '#/components/schemas/Question'
    Question:
      type: object
      required: [number, text, options]
      properties:
        number:
          type: integer
          minimum: 1
          maximum: 30
        text:
          type: string
        options:
          type: array
          minItems: 5
          maxItems: 5
          items:
            type: object
            required: [value, label]
            properties:
              value:
                type: integer
                minimum: 1
                maximum: 5
              label:
                type: string
