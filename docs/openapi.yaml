  /api/v1/admin/campaigns/{id}/preview:
    post:
      summary: 캠페인 실행 시각 기준으로 예상 대상 집계
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedVersion: {type: integer, format: int64, minimum: 0}
      responses:
        '200':
          description: 10분 동안 확정에 사용할 수 있는 캠페인 미리보기
          content:
