        - &editorial_type {in: query, name: type, schema: {type: string}}
        - &editorial_q {in: query, name: q, schema: {type: string, maxLength: 80}}
        - &editorial_author {in: query, name: authorId, schema: {type: string, format: uuid}}
        - &editorial_from {in: query, name: from, schema: {type: string, format: date}}
        - &editorial_to {in: query, name: to, schema: {type: string, format: date}}
        - &editorial_page {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - &editorial_size {in: query, name: size, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200': {description: items·total·page·size 및 작업 버전·공개 버전·수정자 정보}
        '422': {description: 페이지 또는 필터 범위 오류}
  /api/v1/admin/contents/{id}/transitions:
    post:
      summary: 공지·가이드·인사이트 버전 상태 전환
      description: 작성자는 초안을 보관할 수 있다. 최고관리자는 비공개 또는 만료 버전을 보관할 수 있다.
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revisionId, action, expectedVersion]
              properties:
                revisionId: {type: string, format: uuid}
                action: {enum: [SUBMIT, WITHDRAW, APPROVE, REJECT, PUBLISH, SCHEDULE, CANCEL_SCHEDULE, UNPUBLISH, ARCHIVE]}
                expectedVersion: {type: integer, format: int64}
                reason: {type: string, maxLength: 500}
                startsAt: {type: string, format: date-time}
                endsAt: {type: string, format: date-time}
                serviceOnlyConfirmed: {type: boolean}
      responses:
        '200': {description: 전환된 버전}
        '403': {description: 역할·작성자 또는 요청 검증 실패}
        '409': {description: 상태·버전 또는 멱등 키 충돌}
  /api/v1/admin/contents/lookup:
    get:
      summary: 콘텐츠 ID로 운영 상세의 버전을 조회한다
      parameters:
        - {in: query, name: kind, required: true, schema: {type: string, enum: [NOTICE, GUIDE, INSIGHT]}}
