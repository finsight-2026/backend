name: 백엔드 CI 및 배포

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    name: 테스트 및 이미지
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 운영 태그의 main 이력 확인
        if: github.ref_type == 'tag'
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: ./gradlew --no-daemon test bootJar
      - name: 컨테이너 빌드
        if: github.event_name == 'pull_request'
        run: docker build --tag finsight-backend:ci .
      - name: GHCR에 이미지 게시
        id: publish
        if: github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build --platform linux/amd64 --push \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$repository:$GITHUB_SHA" --metadata-file image.json .
          digest="$(jq -er '."containerimage.digest"' image.json)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'image=%s@%s\n' "$repository" "$digest" >>"$GITHUB_OUTPUT"
          docker logout ghcr.io
  staging:
    name: 스테이징 배포
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: finsight-backend-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: bash deploy/dispatch.sh
        env:
          DEPLOY_DOMAIN: staging.finsight.life
          DEPLOY_IMAGE: ${{ needs.verify.outputs.image }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
  production:
    name: 운영 배포
    if: github.ref_type == 'tag'
    needs: [verify, staging]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: finsight-backend-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: bash deploy/dispatch.sh
        env:
          DEPLOY_DOMAIN: api.finsight.life
          DEPLOY_IMAGE: ${{ needs.verify.outputs.image }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
