spring.application.name=finsight
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
management.endpoints.web.exposure.include=health

finsight.discord.enabled=${FINSIGHT_DISCORD_ENABLED:false}
finsight.discord.signup=${FINSIGHT_DISCORD_SIGNUP_WEBHOOK:}
finsight.discord.withdrawal=${FINSIGHT_DISCORD_WITHDRAWAL_WEBHOOK:}
finsight.discord.survey=${FINSIGHT_DISCORD_SURVEY_WEBHOOK:}
finsight.discord.news=${FINSIGHT_DISCORD_NEWS_WEBHOOK:}
