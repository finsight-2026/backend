server.address=127.0.0.1
spring.datasource.url=jdbc:postgresql://127.0.0.1:${FINSIGHT_DB_PORT:55432}/finsight
spring.datasource.username=finsight
spring.datasource.password=${FINSIGHT_DB_PASSWORD}

finsight.signup.code-key=${FINSIGHT_SIGNUP_CODE_KEY}
finsight.policy.preview=${FINSIGHT_POLICY_PREVIEW:true}

finsight.auth.jwt-key=${FINSIGHT_APP_JWT_KEY}

finsight.admin.password-only-email=${FINSIGHT_ADMIN_PASSWORD_ONLY_EMAIL:}
finsight.admin.mfa-key=${FINSIGHT_ADMIN_MFA_KEY:}
finsight.admin.pwned-passwords=${FINSIGHT_ADMIN_PWNED_PASSWORDS:false}
finsight.experiments.diagnosis-entry=${FINSIGHT_EXPERIMENT_DIAGNOSIS_ENTRY_ENABLED:true}

finsight.admin.note-key=${FINSIGHT_ADMIN_NOTE_KEY:}
finsight.admin.pii-key=${FINSIGHT_ADMIN_PII_KEY:}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

finsight.push.fcm-enabled=${FINSIGHT_FCM_ENABLED:false}
finsight.push.fcm-project=${FINSIGHT_FCM_PROJECT:}
