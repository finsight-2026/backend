services:
  backend:
    image: ${FINSIGHT_BACKEND_IMAGE:?Set an immutable backend image}
    restart: unless-stopped
    mem_limit: ${FINSIGHT_BACKEND_MEMORY:-768m}
    ports:
      - "127.0.0.1:${FINSIGHT_LOCAL_PORT:?Set the local port}:8080"
    env_file:
      - runtime.env
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_ADDRESS: 0.0.0.0
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      FINSIGHT_POLICY_PREVIEW: "false"
    volumes:
      - ./postgres-ca.pem:/run/finsight/postgres-ca.pem:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=32m
